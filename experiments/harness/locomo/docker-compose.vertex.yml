# Vertex override for the LoCoMo conv0 run — routes Caura's memory creation
# (write-path classifier / platform LLM) through Vertex AI.
#
# Org policy iam.disableServiceAccountKeyCreation blocks SA keys, so this mounts
# the operator's USER Application Default Credentials (authorized_user) read-only
# into the container and points GOOGLE_APPLICATION_CREDENTIALS at it. The ADC file
# already carries quota_project_id=project-6daf51c7-b33c-415b-954; we also set
# GOOGLE_CLOUD_QUOTA_PROJECT explicitly. Entity extraction stays on AI Studio.
#
# Apply (from repo root), restart only core-api:
#   LOCOMO_VERTEX_ADC=$HOME/.config/gcloud/application_default_credentials.json \
#   docker compose -f docker-compose.yml -f docker-compose.override.yml \
#     -f experiments/harness/locomo/docker-compose.vertex.yml up -d core-api
#
# The ADC file lives in $HOME (outside git) and is mounted directly — never copied
# into the repo. See CREDENTIALS.md.
services:
  core-api:
    environment:
      # memory creation -> Vertex (no OpenAI fallback). Stable model name.
      PLATFORM_LLM_PROVIDER: vertex
      PLATFORM_LLM_MODEL: gemini-3.1-flash-lite
      PLATFORM_LLM_GCP_PROJECT_ID: project-6daf51c7-b33c-415b-954
      # global, not us-central1: this project's gemini-3.x models 404 on the
      # regional endpoint but are served from global (verified by tiny call).
      PLATFORM_LLM_GCP_LOCATION: global
      # entity extraction stays on AI Studio (uses GEMINI_API_KEY from .env)
      ENTITY_EXTRACTION_PROVIDER: gemini
      ENTITY_EXTRACTION_MODEL: gemini-3.1-flash-lite
      # ADC for the Vertex platform client inside the container (user creds)
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/adc.json
      GOOGLE_CLOUD_PROJECT: project-6daf51c7-b33c-415b-954
      GOOGLE_CLOUD_QUOTA_PROJECT: project-6daf51c7-b33c-415b-954
    volumes:
      - ${LOCOMO_VERTEX_ADC:?set LOCOMO_VERTEX_ADC to the host path of application_default_credentials.json}:/secrets/adc.json:ro
